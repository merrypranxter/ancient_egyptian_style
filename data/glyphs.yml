- id: hieroglyph_a1_man
  name: Seated Man (A1)
  motif_type: glyph
  glyph_class: determinative
  usage_mode:
  - narrative
  - decorative
  visual_complexity: 2
  primary_shapes:
  - seated_figure
  - bent_knees
  - hand_to_mouth
  prompt_tokens:
