id: egy.shader_relief_render_pipeline
type: pipeline
name: "3D → Relief Render Pipeline"
aliases: ["relief render pipeline", "3D to relief shader pipeline", "bas-relief render workflow"]
summary: >
  A pipeline for converting 3D-rendered or photographic source material into a
  period-accurate Egyptian bas-relief appearance using a sequence of shader passes.
description: >
  This pipeline converts any 3D render (Blender, Cinema 4D, etc.) or photographic
  source into the visual aesthetic of carved Egyptian stone relief.

  STAGE 1: SOURCE PREPARATION
  - Input: 3D render with separate passes: colour (beauty), depth, normal map.
  - Or: photograph of a sculpture, with estimated depth map generated by monocular
    depth estimation (MiDaS, ZoeDepth, etc.).

  STAGE 2: HEIGHT MAP DERIVATION
  - Use depth pass or estimated depth to create a normalised height map.
  - Flatten the height map: boost mid-range, compress extremes — Egyptian relief
    is shallow, not sculptural.
  - Blur height map slightly (Gaussian σ=1.5px) for smooth transitions.

  STAGE 3: NORMAL MAP GENERATION
  From the processed height map, generate a normal map (Sobel-based).

  STAGE 4: RELIEF SHADING PASS
  Apply egy.relief_shading_shader with:
  - Light direction: upper-left 45° (315°)
  - Hard shadow threshold: 0.85
  - Base texture: select stone type from egy.stone_surface_texture
  
  STAGE 5: COLOUR FILL (optional)
  - Assign flat pigment colours to detected flat zones using colour segmentation.
  - Apply egy.palette_map_shader to colour zones.
  - Preserve carved edge zones (shadow + highlight from Stage 4) without colour fill.

  STAGE 6: EDGE INK PASS
  Apply egy.edge_ink_shader over the composite to add ink-like edge definition.

  STAGE 7: AGING (optional)
  Apply egy.dust_patina_artifact or egy.pigment_flake_artifact per target context.

  OUTPUT: A flat-perspective image that reads as carved stone relief painting.
tags:
  period: [general_ancient_egypt]
  medium: [temple_relief, stone]
  surface: [carved, painted, weathered]
  shader_ops: [relief_shading, edge_ink, palette_map, noise, displacement]
  mood: [monumental, regal, solemn]
constraints:
  do:
    - "Flatten the depth range in STAGE 2 — over-deep maps look sculptural, not relief."
    - "Apply hard shadow in STAGE 4 — this is the key differentiator from 3D rendering."
    - "Stone base texture must be warm-toned (limestone or sandstone)."
  avoid:
    - "Avoid smooth gradient shading from the 3D source — flatten and threshold."
    - "Avoid including specular highlights from the original 3D pass — matte only."
parameters:
  height_map_blur_sigma: 1.5
  light_direction_degrees: 315
  shadow_threshold: 0.85
  stone_base: "limestone"
  aging_coverage_percent: [0, 20]
compat:
  pairs_with:
    - egy.relief_shading_shader
    - egy.edge_ink_shader
    - egy.stone_surface_texture
    - egy.palette_map_shader
  avoid_with:
    - egy.papyrus_scroll_style
prompt_fragment: >
  "3D to Egyptian relief render pipeline, carved limestone relief appearance,
  hard-edge directional shadow, warm stone base, flat colour zones,
  period-accurate relief aesthetic"
provenance:
  notes: >
    Depth estimation using MiDaS (https://github.com/isl-org/MiDaS) is
    recommended for photographic inputs when a depth pass is not available.
version: "1.0"
created_at: "2026-04-10"
